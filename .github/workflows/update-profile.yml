name: Update profile

on:
  schedule:
    - cron: "17 4 * * *"   # daily — keeps the banner's "updated" date current
  workflow_dispatch:
  push:
    branches: [main]
    paths: [generate_v3.py]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install type tools
        run: pip install fonttools uharfbuzz
      - name: Regenerate banners
        run: python generate_v3.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add v3-dark.svg v3-light.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile banner"
          git push
